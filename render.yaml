services:
  - type: web
    name: metertruth-private-beta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BETA_USERNAME
        sync: false
      - key: BETA_PASSWORD
        sync: false
